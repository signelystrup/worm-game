name: Node.js CI

#on:
  #push:
    #branches: ["main"]
  #pull_request:
    #branches: ["main"]

env:
  DATABASE_URL: postgres://postgres:secret@localhost:5432/addresses

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build --if-present

      - name: Run unit tests
        run: npm run test

      - name: Start testing database
        run: docker compose -f docker-ci-cd-compose.yaml up -d --wait

      - name: Run migrations
        run: npx drizzle-kit migrate

      - name: Run integration tests
        run: npm run intergration-test
      
      - name: Start the api
        run: npm start &

      - name: Run Bruno API tests
        working-directory: bruno/person_test_data
        run: |
          npm install --global @usebruno/cli
          bru run --env local

  playwright:
    name: Playwright Tests
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start testing database
        run: docker compose -f docker-ci-cd-compose.yaml up -d --wait

      - name: Run migrations
        run: npx drizzle-kit migrate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  sonarqube:
    name: SonarQube Analysis
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
