info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/login
  body:
    type: json
    data: |-
      {
        "email": "admin",
        "password": "admin"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        bru.setEnvVar("admin-token", response.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
