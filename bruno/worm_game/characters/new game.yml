info:
  name: new game
  type: http
  seq: 2

http:
  method: POST
  url: "{{SERVER}}/characters/"
  body:
    type: json
    data: |-
      {
        "accountId": 1,
        "archetypeId": 1,
        "characterName": "Bob"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
